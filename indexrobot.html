<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Robot Team Online</title>

  <link rel="stylesheet" href="stylerobot.css">
</head>

<body>

  <header>
    <h1>ROBOT TEAM ONLINE</h1>
    <p id="status">Connecting...</p>
  </header>

  <main>

    <section id="room">

      <div id="roomTitle">
        <span>MISSION ROOM</span>
        <span>4-ROBOT SQUAD</span>
      </div>

      <div id="gameRoom"></div>

    </section>

    <section id="robotInfo">

      <h2>ACTIVE SQUAD</h2>

      <div id="squadList"></div>

    </section>

    <section id="controls">

      <button data-key="up">▲</button>

      <div>
        <button data-key="left">◀</button>
        <button data-key="down">▼</button>
        <button data-key="right">▶</button>
      </div>

    </section>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="gamerobot.js"></script>

</body>
</html>
