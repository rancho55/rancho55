<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Team Game</title>
  <link rel="stylesheet" href="style-robot.css">
</head>
<body>

  <header>
    <h1>ROBOT SQUAD</h1>
    <p id="status">CONNECTING...</p>
  </header>

  <main>
    <div id="room">
      <div id="roomTitle">
        <span>SECTOR 01</span>
        <span>ONLINE SQUAD</span>
      </div>
      <div id="gameRoom"></div>
    </div>

    <div id="robotInfo">
      <h2>SQUAD STATUS</h2>
      <div id="squadList"></div>
    </div>

    <div id="controls">
      <div>
        <button data-key="up">▲</button>
      </div>
      <div>
        <button data-key="left">◀</button>
        <button data-key="down">▼</button>
        <button data-key="right">▶</button>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script-robot.js"></script>
</body>
</html>
